x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: streamsentinel-app
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:9092
    MLFLOW_TRACKING_URI: http://mlflow:5000
    SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
    WINDOW_SECONDS: ${WINDOW_SECONDS:-10}
    Z_THRESHOLD: ${Z_THRESHOLD:-}
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in trades features scores; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: "no"

  mlflow:
    <<: *app
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  trainer:
    <<: *app
    command: ["python", "-m", "streamsentinel.training.train"]
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: streamsentinel-spark
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      WINDOW_SECONDS: ${WINDOW_SECONDS:-10}
      WATERMARK_SECONDS: ${WATERMARK_SECONDS:-3}
      CHECKPOINT_DIR: /checkpoints/features
    volumes:
      - spark-checkpoints:/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  detector:
    <<: *app
    command: ["python", "-m", "streamsentinel.services.detector_service"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      ANOMALY_DB_PATH: /data/anomalies.db
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api-data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    <<: *app
    # SOURCE=binance (live market data, default) or SOURCE=simulator (labelled anomalies)
    command: ["python", "-m", "streamsentinel.producers.${SOURCE:-binance}"]
    environment:
      <<: *app-env
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443/stream}
      SIM_ANOMALY_RATE: ${SIM_ANOMALY_RATE:-0.03}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  mlflow-data:
  spark-checkpoints:
  api-data:
