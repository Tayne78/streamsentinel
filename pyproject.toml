[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsentinel"
version = "0.1.0"
description = "Real-time anomaly detection on streaming market data with Kafka, Spark Structured Streaming and MLflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Kaiser" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
ingest = ["websockets>=13"]
ml = ["mlflow==2.22.1", "sqlalchemy>=2.0,<2.1"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
spark = ["pyspark==4.0.1"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
all = ["streamsentinel[kafka,ingest,ml,api,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamsentinel = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs pyspark and a Java runtime"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
